# Exemple de reverse proxy nginx pour Caffein (HTTPS avec certbot / Let's Encrypt).
#   1. Copiez ce fichier dans /etc/nginx/sites-available/caffein et adaptez server_name.
#   2. Dans /etc/caffein/caffein.env : CAFFEIN_APP_URL=https://caffein.example.com
#   3. sudo certbot --nginx -d caffein.example.com && sudo systemctl reload nginx

server {
    listen 80;
    server_name caffein.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name caffein.example.com;

    # Renseigné par certbot
    # ssl_certificate     /etc/letsencrypt/live/caffein.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/caffein.example.com/privkey.pem;

    client_max_body_size 25m;   # dépôt de justificatifs (20 Mo par fichier)
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # extraction IA des documents
    }
}
