[project]
name = "caffein"
version = "2.0.0"
description = "Gestion libre pour freelances et TPE : devis, factures, relances, TVA et URSSAF"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
readme = "../README.md"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
