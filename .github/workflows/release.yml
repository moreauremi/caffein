# SPDX-License-Identifier: AGPL-3.0-or-later
# Publication d'une version : git tag v2.1.0 && git push --tags
#  - archive caffein-<version>.tar.gz avec l'interface déjà buildée (installation sans Node.js)
#  - image Docker multi-architecture sur ghcr.io/<propriétaire>/<dépôt>
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci && npm run build
      - name: Archive
        run: |
          V=${GITHUB_REF_NAME#v}
          git archive --format=tar --prefix="caffein-$V/" -o "caffein-$V.tar" HEAD
          tar -rf "caffein-$V.tar" --transform "s,^,caffein-$V/," frontend/dist
          gzip -9 "caffein-$V.tar"
          sha256sum "caffein-$V.tar.gz" > "caffein-$V.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            caffein-*.tar.gz
            caffein-*.tar.gz.sha256
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
